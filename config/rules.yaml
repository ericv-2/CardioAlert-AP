# Regles del motor cardio-renal-metabòlic.
# Cada regla es pot desactivar amb "enabled: false" i els llindars es canvien aquí,
# sense tocar codi. TOTS ELS VALORS ESTAN PENDENTS DE VALIDACIÓ PEL METGE.
#
# Codis: diagnòstics en CIAP-2, proves en LOINC, fàrmacs per grup (vegeu model/cataleg.py).
#
# Cada regla porta "evidencia" (classe de recomanació que el motor cita com a
# "<evidencia> - <motor.guia>") i "pes" (punts que suma a la puntuació de prioritat 0-100).

rules:

  uacr_falta:
    enabled: true
    evidencia: Clase I
    pes: 15
    descripcio: Diabètic, hipertens o MRC sense UACR en més de 12 mesos
    diagnostics: [T90, K86, U99.01]   # DM2, HTA, MRC (n'hi ha prou amb un)
    prova: "9318-7"                   # UACR
    max_mesos_sense_prova: 12

  creatinina_falta:
    enabled: true
    evidencia: Clase I
    pes: 15
    descripcio: Pacient crònic sense creatinina en més de 12 mesos
    diagnostics: [T90, K86, U99.01, K77, T93]   # DM2, HTA, MRC, IC, dislipèmia
    prova: "2160-0"                   # creatinina
    max_mesos_sense_prova: 12

  fge_descens:
    enabled: true
    evidencia: Clase IIa
    pes: 30
    descripcio: Pèrdua ràpida de filtrat glomerular
    prova: "62238-1"                  # FGe
    descens_anual_llindar: 5.0        # mL/min/1,73m² per any (alerta si la pèrdua és superior)
    descens_fisiologic: [0.5, 1.0]    # mL/min/1,73m² per any (referència, informatiu)
    min_mesures: 3
    min_mesos_seguiment: 12

  albuminuria_sense_accio:
    enabled: true
    evidencia: Clase I
    pes: 30
    descripcio: Albuminúria sense tractament nefroprotector
    prova: "9318-7"
    uacr_llindar: 30                  # mg/g (alerta si UACR >= llindar)
    grups_protectors: [IECA, ARA-II, iSGLT2]   # n'hi ha prou amb un per no alertar

  mrc_no_diagnosticada:
    enabled: true
    evidencia: Clase I
    pes: 30
    descripcio: Criteris analítics de MRC sense diagnòstic registrat
    fge_llindar: 60                   # mL/min/1,73m² (criteri si FGe < llindar)
    uacr_llindar: 30                  # mg/g (criteri si UACR >= llindar)
    min_mesures: 2
    min_mesos_separacio: 3
    diagnostic_excloent: U99.01       # MRC

  possible_ic:
    enabled: true
    evidencia: Clase I
    pes: 30
    descripcio: NT-proBNP elevat per a l'edat sense diagnòstic d'insuficiència cardíaca
    prova: "33762-6"                  # NT-proBNP
    llindars_per_edat:                # pg/mL (alerta si valor >= llindar)
      - {edat_max: 49, llindar: 125}  # < 50 anys
      - {edat_max: 75, llindar: 250}  # 50-75 anys
      - {edat_max: 200, llindar: 500} # > 75 anys
    llindar_descarta: 125             # pg/mL (per sota, la IC queda descartada)
    mrc_avancada:                     # amb MRC avançada el NT-proBNP puja sense IC: llindar mínim més alt
      fge_max: 30                     # mL/min/1,73m² (MRC avançada si FGe < valor)
      llindar: 500                    # pg/mL
    diagnostic_excloent: K77          # IC

  risc_cardiovascular:
    enabled: true
    descripcio: Risc cardiovascular alt o molt alt (taula 5 de la guia ESC 2021) sense tractament adequat
    guia: "ESC 2021"                  # guia que se cita a l'alerta de risc CV (taula 5, figures 3 i 6)
    # score2 = mode ESC automàtic: el motor tria la variant per pacient
    #   diabetis i 40-69 anys -> SCORE2-Diabetes | >= 70 anys -> SCORE2-OP | < 70 sense diabetis -> SCORE2
    # totes_dues = el mateix + REGICOR al costat, NOMÉS com a referència (avís de calibració): la categoria
    #   surt sempre de SCORE2 / SCORE2-OP / SCORE2-Diabetes, sense reclassificar
    # regicor = REGICOR (35-74 anys) com a escala principal; només per a comparacions manuals (no és taula 5)
    escala_per_defecte: totes_dues
    regio_score2: baix                # baix | moderat | alt | molt_alt (Espanya: risc baix, figura 3 ESC 2021)
    edat_min: 40                      # per sota, SCORE2 no és aplicable: només regles renals i proves pendents
    alertes:                          # punts i classe de recomanació de l'alerta segons la categoria (taula 5)
      alt: {pes: 20, evidencia: Clase IIa}        # "valorar tratamiento (decisión compartida)"
      molt_alt: {pes: 35, evidencia: Clase I}     # "tratamiento generalmente recomendado"
      gent_gran: {edat_min: 70, evidencia: Clase IIb}   # >= 70 anys aparentment sans: fragilitat i preferències
    talls_per_edat:                   # % de risc a 10 anys: alt si >= "alt", molt alt si >= "molt_alt" (talls ESC)
      - {edat_max: 49, alt: 2.5, molt_alt: 7.5}    # < 50 anys
      - {edat_max: 69, alt: 5, molt_alt: 10}       # 50-69 anys
      - {edat_max: 200, alt: 7.5, molt_alt: 15}    # >= 70 anys
    talls_regicor: {alt: 10, molt_alt: 15}         # % (REGICOR té talls propis, no depenen de l'edat)
    ckd_addon:                        # SCORE2 CKD Add-on (FGe + UACR) quan hi ha afectació renal
      enabled: true
      fge_max: 60                     # afectació renal si FGe < valor...
      uacr_min: 30                    # ...o si UACR >= valor (mg/g)
      models: [SCORE2, SCORE2-OP]     # SCORE2-Diabetes ja inclou el FGe a l'equació: afegir-lo aquí el comptaria dos cops
    reclassificacio_kdigo: true       # amb MRC, KDIGO taronja => risc alt; vermell => molt alt
    diagnostics_ecv: [K74, K75, K76, K89, K90, K91, K92]   # MCV establerta => risc molt alt directe (sense escala)
    diagnostics_hf: []                # codis d'hipercolesterolèmia familiar => risc alt directe (sense escala);
                                      # el catàleg actual no en té cap: pendent que el metge digui quin codi fa servir

  ben_tractat:
    enabled: true
    descripcio: Pacient amb tractament i objectius correctes (control positiu)
    ieca_ara2_i_isglt2_si: [T90, U99.01]        # IECA o ARA-II + iSGLT2 si DM o MRC
    grups_bloqueig_sraa: [IECA, ARA-II]
    grup_isglt2: iSGLT2
    estatina_si_risc_alt: true
    estatina_si_dislipemia: true                # diagnòstic T93
    hba1c_objectiu: 7.0                         # % (objectiu: < valor)
    # Objectius de tractament (figura 6 de la guia ESC 2021), esglaonats:
    #   pas 1 (criteri de "ben tractat"): PAS < sistolica i LDL < base
    #   pas 2 (acció d'intensificació, no alerta): PAS < sistolica_optima si es tolera; LDL < alt / molt_alt segons el risc
    pressio_objectiu: {sistolica: 140, sistolica_optima: 130, diastolica: 90}   # mmHg (objectiu: < valors)
    ldl_objectiu: {base: 100, alt: 70, molt_alt: 55}                            # mg/dL (objectiu: < valors)
    proves_recents: ["9318-7", "2160-0"]        # UACR i creatinina
    max_mesos_proves: 12

# Paràmetres generals del motor (engine/). TAMBÉ PENDENTS DE VALIDACIÓ PEL METGE.
motor:
  guia: "ESC/ERA 2026"                # guia que se cita a alertes i accions
  data_referencia: 2026-11-13         # "avui" de la demo; null = data real del sistema
  equacio_fge: ckd_epi_2009           # ckd_epi_2009 (sense factor racial) | ckd_epi_2021

  possible_fra:                       # caiguda aguda inesperada del FGe (possible fracàs renal agut)
    enabled: true
    evidencia: Clase I
    pes: 40
    caiguda_pct: 30                   # % respecte de la mesura anterior (alerta si >=)
    max_mesos_entre_mesures: 18
    caiguda_esperada_min_pct: 10      # entre aquest % i caiguda_pct després d'iniciar iSGLT2/IECA/ARA-II: avís "esperada"

  derivacio_nefrologia:
    enabled: true
    evidencia: Clase I
    pes: 35
    kfre_5a_pct: 5                    # % de risc de fallida renal a 5 anys (deriva si >=)
    fge_max: 30                       # deriva si FGe < valor
    uacr_min: 700                     # mg/g (deriva si >=)
    duplicacio_uacr: true             # deriva si l'UACR es duplica (i queda >= 30 mg/g)

  oportunitats:                       # oportunitats terapèutiques (accions recomanades)
    isglt2: {enabled: true, evidencia: Clase I, fge_min: 20, uacr_min_sense_dm: 200}
    estatina: {enabled: true, evidencia: Clase I, fge_max: 60}          # FGe < 60 sense hipolipemiant, sigui quin sigui l'LDL
    sraa: {enabled: true, evidencia: Clase I, uacr_min: 30}             # IECA/ARA-II si albuminúria
    pressio: {enabled: true, evidencia: Clase I}    # en HTA, DM2 o MRC; objectius a ben_tractat.pressio_objectiu
    finerenona: {enabled: true, evidencia: Clase I, uacr_min: 30, potassi_max: 4.8}
    aglp1: {enabled: true, evidencia: Clase I, uacr_min: 30}            # semaglutida en DM2 + albuminúria
    aas_prevencio_primaria: {enabled: true, evidencia: Clase III, pes: 10, grup: AAS}

  prioritat:                          # puntuacio_prioritat = suma dels pesos de les alertes + KDIGO (màx. 100)
    kdigo: {verd: 0, groc: 3, taronja: 8, vermell: 15}
    # Ordre de la llista de treball (NO és una classificació de risc): 1) alertes urgents, 2) risc "Muy alto"
    # sense tractament adequat, 3) risc "Alto" sense tractament, 4) la resta; dins de cada grup, per puntuació.
    # fge_descens (pèrdua ràpida de FGe) és urgent per decisió del metge (validat el 15/11/2026)
    alertes_urgents: [possible_ic, possible_fra, derivacio_nefrologia, fge_descens]
    # Proves pendents: van a la vista "Pruebas pendientes" (petició conjunta). No sumen punts, no fan entrar
    # ningú a "Hoy" i no tornen un pacient a "Pendiente".
    alertes_fora_avui: [uacr_falta, creatinina_falta]
    pacients_avui: 10                 # mida del bloc "Hoy: N pacientes prioritarios"
